# Cloud Run service for one client's API (asia-south1, Mumbai).
# Replace every REPLACE_ME value before use. Secrets are read from Secret Manager, never written here.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: evc-api
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"          # scale to zero when idle (cost)
        autoscaling.knative.dev/maxScale: "3"          # raise only when traffic needs it
        run.googleapis.com/cloudsql-instances: REPLACE_ME_PROJECT:asia-south1:evc-db
    spec:
      containerConcurrency: 40
      timeoutSeconds: 60
      containers:
        - image: asia-south1-docker.pkg.dev/REPLACE_ME_PROJECT/evc/backend:REPLACE_ME_TAG
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: EVC_CLIENT_ID
              value: client-a
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql:///evcharge?cloudSqlInstance=REPLACE_ME_PROJECT:asia-south1:evc-db&socketFactory=com.google.cloud.sql.postgres.SocketFactory
            - name: SPRING_DATASOURCE_USERNAME
              value: evcharge
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: evc-db-password
                  key: latest
            - name: EVC_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: evc-jwt-secret
                  key: latest
            - name: SMS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: evc-sms-api-key
                  key: latest
            - name: MSG91_SENDER_ID
              value: REPLACE_ME_6_CHAR_SENDER_ID
            - name: MSG91_DLT_TEMPLATE_ID
              value: REPLACE_ME_DLT_TEMPLATE_ID
