<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EV Charging Platform - Prototype</title>
<style>
  :root{--bg:#f3f6fb;--card:#fff;--ink:#1d2433;--mute:#6b7487;--line:#e3e8f1;--blue:#0a6cff;--green:#14a86b;--amber:#f0a500;--red:#e5484d;--dark:#0e1624}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
  .banner{background:var(--dark);color:#fff;padding:12px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
  .banner b{font-size:15px}
  .banner small{color:#9fb0cc}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tab{background:transparent;color:#cfd9ec;border:1px solid #33425c;border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:600}
  .tab.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .stage{padding:24px;display:flex;justify-content:center}
  .phone{width:390px;height:800px;background:#111;border-radius:44px;padding:12px;box-shadow:0 20px 50px rgba(10,20,40,.25)}
  .screen{width:100%;height:100%;background:#fff;border-radius:34px;overflow:hidden;display:flex;flex-direction:column;position:relative}
  .sbody{flex:1;overflow-y:auto;padding:16px 18px 20px}
  .sbar{padding:14px 18px 6px;display:flex;justify-content:space-between;font-size:12px;color:var(--mute)}
  .hdr{font-size:20px;font-weight:700;margin:4px 0 10px;display:flex;align-items:center;gap:8px}
  .back{background:#eef2f8;border:0;border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:16px}
  .btn{display:block;width:100%;background:var(--blue);color:#fff;border:0;border-radius:12px;padding:13px;font-weight:700;font-size:15px;cursor:pointer;margin-top:12px;font-family:inherit}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.ghost{background:#eef2f8;color:var(--ink)}
  .btn.red{background:var(--red)}
  .btn.sm{display:inline-block;width:auto;padding:7px 12px;font-size:12px;margin:0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
  .row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .mute{color:var(--mute);font-size:12px}
  .pill{display:inline-block;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
  .ok{background:#dcf5ea;color:#0b7a4d}.warn{background:#fff1cc;color:#8a5f00}.bad{background:#fde0e1;color:#a4272b}.info{background:#dde9ff;color:#0a4fbf}.gray{background:#eceff5;color:#4b5567}
  input,select,textarea{width:100%;padding:11px;border:1px solid #d6dde9;border-radius:10px;font-size:14px;margin-top:4px;background:#fff;font-family:inherit}
  label{display:block;margin-top:10px;font-weight:600;font-size:12px;color:var(--mute)}
  .map{position:relative;height:280px;border-radius:16px;background:#e9efe9;overflow:hidden;border:1px solid var(--line)}
  .pin{position:absolute;transform:translate(-50%,-100%);background:var(--blue);color:#fff;border:0;border-radius:14px 14px 14px 2px;padding:4px 7px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap}
  .pin.off{background:#8a93a6}.pin.busy{background:var(--amber);color:#2b1d00}
  .nav{display:flex;justify-content:space-around;border-top:1px solid var(--line);padding:8px 0 14px;background:#fff}
  .nav button{background:none;border:0;font-size:11px;color:var(--mute);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit}
  .nav button.on{color:var(--blue);font-weight:700}
  .ring{position:relative;width:200px;height:200px;margin:12px auto}
  .ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .big{font-size:30px;font-weight:800;color:var(--blue)}
  .chip{display:inline-block;border:1px solid #cfd8e6;border-radius:999px;padding:6px 12px;margin:3px;cursor:pointer;font-weight:600;font-size:12px;background:#fff}
  .chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
  .tog{width:42px;height:24px;background:#c9d1df;border-radius:999px;position:relative;cursor:pointer;flex:none}
  .tog::after{content:"";position:absolute;width:20px;height:20px;background:#fff;border-radius:50%;top:2px;left:2px;transition:.2s}
  .tog.on{background:var(--green)}.tog.on::after{left:20px}
  .bars{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:8px}
  .bars div{flex:1;background:var(--blue);border-radius:6px 6px 0 0;position:relative;min-height:4px}
  .bars span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:10px;color:var(--mute)}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
  .kpi b{font-size:22px;display:block;margin-top:4px}
  .admin{display:flex;width:1200px;max-width:100%;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;min-height:760px}
  .side{width:220px;background:#0f1a2e;color:#c9d4e8;padding:16px 10px;flex:none}
  .side h4{font-size:11px;letter-spacing:.08em;color:#6f819f;margin:14px 10px 6px;text-transform:uppercase}
  .side button{display:block;width:100%;text-align:left;background:none;border:0;color:#c9d4e8;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:14px;font-family:inherit}
  .side button.on,.side button:hover{background:#1d2c46;color:#fff}
  .main{flex:1;padding:22px 26px;min-width:0}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{color:var(--mute);font-weight:600;font-size:12px;background:#f8fafd}
  .notice{background:#fff8e1;border:1px solid #ffe08a;border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:13px}
  .flow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .toast{position:absolute;left:16px;right:16px;bottom:80px;background:#1d2433;color:#fff;border-radius:12px;padding:10px 12px;font-size:13px;display:none;z-index:5}
  .langbar{display:flex;gap:6px;justify-content:center;margin:6px 0 4px}
</style>
</head>
<body>

<div class="banner">
  <div><b>EV Charging Platform - Clickable Prototype</b><br><small>Mock data only. Not production software. Branding is a placeholder. Customer app in English, Hindi and Marathi.</small></div>
  <select id="clientSel" onchange="S.client=this.value;if(S.cs!=='login'&&S.cs!=='otp'&&S.cs!=='consent')S.cs='home';render()" style="border-radius:8px;padding:7px 10px;font-weight:600;font-family:inherit"></select>
  <div class="tabs">
    <button class="tab" id="t-customer" onclick="setTab('customer')">Customer app</button>
    <button class="tab" id="t-adhoc" onclick="setTab('adhoc')">Ad-hoc web charging</button>
    <button class="tab" id="t-admin" onclick="setTab('admin')">Admin portal (English)</button>
  </div>
</div>

<div id="app" class="stage"></div>

function startSession(){
  const st = stById(S.stationId);
  S.session = {kwh:0, target:S.target, rate:st.rate, sec:0, station:st.name, running:true};
  if(timer) clearInterval(timer);
  timer = setInterval(()=>{ if(!S.session||!S.session.running) return;
    S.session.sec++; S.session.kwh = Math.min(S.session.target, S.session.kwh+0.25);
    if(S.session.kwh>=S.session.target){ S.session.running=false; clearInterval(timer); toast(t('chargingComplete')); if(S.tab==='adhoc') S.adhocStep='done'; go('receipt'); return; }
    if(S.cs==='live') render(); }, 500);
  go('live');
}

function adhocHTML(){
  const st = STATIONS[0];
  const wrap = (inner)=>`<div style="max-width:420px;margin:0 auto;background:#fff;border-radius:16px;border:1px solid var(--line);padding:18px;min-height:600px">
     <div class="row" style="border:0"><b>EV Charging · Web</b><span class="mute">yourbrand.web.app</span></div>${langBar()}${inner}</div>`;
  const step = S.adhocStep;
  if(step==='scan') return wrap(`<div class="hdr" style="margin-top:10px">${t('scanTitle')}</div>
    <p class="mute">${t('scanSub')}</p>
    <div class="card" style="text-align:center;height:200px;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#f4f7fb,#f4f7fb 10px,#eaf0f8 10px,#eaf0f8 20px)"><b>[ QR ]</b></div>
    <button class="btn" onclick="S.adhocStep='station';S.stationId='ST-001';render()">${t('simulateScan')}: ${st.name}</button>`);
  if(step==='station') return wrap(`<div class="hdr">${st.name}</div><div class="mute">${st.addr}</div>
    ${st.conn.map(c=>`<div class="row" style="cursor:pointer" onclick="S.connId='${c.id}';S.adhocStep='pay';render()"><div><b>${c.t} · ${c.kw} kW</b></div>${statusPill(c.st)}</div>`).join('')}
    <div class="card" style="margin-top:12px"><b>${inr(st.rate)} ${t('perKwh')}</b><div class="mute">+ ${t('taxLabel')} ${TAX.IN.rate*100}%</div></div>`);
  if(step==='pay') return wrap(`<div class="hdr">${t('payStart')}</div>
    <label>${t('energy')}</label><div style="margin-top:6px">${[10,20].map(k=>`<span class="chip ${S.target===k?'on':''}" onclick="S.target=${k};render()">${k} kWh</span>`).join('')}</div>
    <label>${t('payFrom')}</label><div style="margin-top:6px">${[['upi',t('upi')],['card',t('card')],['netbanking',t('netbanking')]].map(([k,l])=>`<span class="chip ${S.payMode===k?'on':''}" onclick="S.payMode='${k}';render()">${l}</span>`).join('')}</div>
    <label>${t('receiptEmail')}</label><input value="priya@example.com">
    <div class="mute" style="margin-top:6px">${t('payCardNote')}</div>
    <button class="btn" onclick="S.adhocStep='live';S.stationId='ST-001';startSession();S.adhocStep='live';render()">${t('pay')} ${inr(S.target*st.rate*1.18)} · ${t('payStart')}</button>`);
  if(step==='live') return wrap(`<div style="transform:scale(.95);transform-origin:top">${liveHTML().replace(/onclick="go\('fault'\)"/,'onclick="toast(\'Fault report (prototype)\')"')}</div>`).replace('onclick="stopSession()"','onclick="stopSession();S.adhocStep=\'done\';render()"');
  if(step==='done') return wrap(`<div class="hdr" style="margin-top:10px">${t('done')}</div>${receiptHTML().replace(/onclick="go\('home'\)"/,'onclick="S.adhocStep=\'scan\';render()"')}`);
  return wrap('');
}

// ---------- render ----------
function render(){
  const b = brand();
  document.documentElement.style.setProperty('--blue', b.color);
  document.documentElement.style.setProperty('--green', b.accent);
  if(!b.langs.includes(S.lang)) S.lang = b.langs[0];
  $('clientSel').innerHTML = Object.keys(CLIENTS).map(k=>`<option value="${k}" ${k===S.client?'selected':''}>${CLIENTS[k].name}</option>`).join('');
  ['customer','adhoc','admin'].forEach(tb=>{ const b=$('t-'+tb); if(b) b.classList.toggle('on', S.tab===tb); });
  let html='';
  if(S.tab==='customer') html = custScreen();
  else if(S.tab==='adhoc') html = `<div style="width:100%">${adhocHTML()}</div>`;
  else html = adminHTML();
  $('app').innerHTML = html;
}
render();
