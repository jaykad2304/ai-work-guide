version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ai-observer-backend
    ports:
      - "8000:8000"
    volumes:
      - ${HOME}/.claude:/root/.claude:ro
      - ${HOME}/.codex:/root/.codex:ro
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/timeline.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ai-observer

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ai-observer-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - VITE_BACKEND_URL=http://localhost:8000
    networks:
      - ai-observer

networks:
  ai-observer:
    driver: bridge
