version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:8000"
      - "8000:8000"
    volumes:
      - ~/.claude:/root/.claude:ro
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/timeline.db
      - DEBUG=False
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
