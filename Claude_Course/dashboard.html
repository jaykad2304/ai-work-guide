<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800"><defs><pattern id="classical" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse"><rect fill="%23c9a961" width="200" height="200"/><circle cx="100" cy="100" r="80" fill="%23d4af37" opacity="0.3"/><path d="M 50 100 Q 100 50 150 100" stroke="%238b7355" stroke-width="2" fill="none" opacity="0.5"/><path d="M 50 150 Q 100 150 150 150" stroke="%238b7355" stroke-width="2" fill="none" opacity="0.3"/></pattern></defs><rect width="1200" height="800" fill="%238B7355"/><rect width="1200" height="800" fill="url(%23classical)" opacity="0.6"/><circle cx="100" cy="100" r="60" fill="%23d4af37" opacity="0.15"/><circle cx="1100" cy="700" r="80" fill="%23c9a961" opacity="0.2"/></svg>');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            opacity: 0.4;
            z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.5);
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            z-index: 1;
        }

        header {
            margin-bottom: 30px;
            text-align: center;
            border-bottom: 2px solid rgba(212, 175, 55, 0.3);
            padding-bottom: 20px;
        }

        h1 {
            color: #2c1810;
            font-size: 32px;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .date-display {
            color: #8b7355;
            font-size: 14px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .content-section {
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #2c1810;
            font-weight: 600;
            margin-bottom: 12px;
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        textarea {
            width: 100%;
            min-height: 350px;
            padding: 20px;
            border: 2px solid rgba(212, 175, 55, 0.4);
            border-radius: 12px;
            font-family: 'Georgia', serif;
            font-size: 15px;
            color: #2c1810;
            background: rgba(255, 255, 255, 0.8);
            resize: vertical;
            transition: all 0.3s ease;
            line-height: 1.6;
        }

        textarea:focus {
            outline: none;
            border-color: #d4af37;
            background: rgba(255, 255, 255, 1);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
        }

        textarea::placeholder {
            color: #b5a892;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid rgba(212, 175, 55, 0.2);
        }

        .save-status {
            font-size: 13px;
            color: #8b7355;
            font-weight: 500;
        }

        .save-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
            background-color: #4caf50;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .word-count {
            font-size: 13px;
            color: #8b7355;
            font-weight: 500;
        }

        .footer-text {
            text-align: center;
            color: #a89968;
            font-size: 12px;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(212, 175, 55, 0.15);
            letter-spacing: 0.5px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
                border-radius: 15px;
            }

            h1 {
                font-size: 24px;
            }

            textarea {
                min-height: 250px;
                font-size: 14px;
            }

            .status-bar {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Daily Dashboard</h1>
            <div class="date-display" id="dateDisplay"></div>
        </header>

        <div class="content-section">
            <label for="dailyNotes">Today's Notes & Entries</label>
            <textarea
                id="dailyNotes"
                placeholder="Write your daily thoughts, tasks, achievements, and reflections here. Everything is automatically saved as you type..."
            ></textarea>
        </div>

        <div class="status-bar">
            <div class="save-status">
                <span class="save-indicator"></span>
                <span id="statusText">Auto-saving enabled</span>
            </div>
            <div class="word-count">
                <span id="wordCount">0</span> words
            </div>
        </div>

        <div class="footer-text">
            ✨ Your entries are automatically saved to your device • Refresh anytime, your data persists
        </div>
    </div>

    <script>
        const textarea = document.getElementById('dailyNotes');
        const dateDisplay = document.getElementById('dateDisplay');
        const statusText = document.getElementById('statusText');
        const wordCount = document.getElementById('wordCount');
        const STORAGE_KEY = 'daily_dashboard_notes';
        const STORAGE_DATE_KEY = 'daily_dashboard_date';
        let saveTimeout;

        // Display current date
        function updateDate() {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const today = new Date().toLocaleDateString('en-US', options);
            dateDisplay.textContent = today;
        }

        // Load saved notes on page load
        function loadNotes() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                textarea.value = saved;
                updateWordCount();
            }
        }

        // Auto-save on input
        function autoSave() {
            clearTimeout(saveTimeout);
            statusText.textContent = 'Saving...';

            saveTimeout = setTimeout(() => {
                localStorage.setItem(STORAGE_KEY, textarea.value);
                localStorage.setItem(STORAGE_DATE_KEY, new Date().toISOString());
                statusText.textContent = 'Auto-saved ✓';

                setTimeout(() => {
                    statusText.textContent = 'Auto-saving enabled';
                }, 2000);
            }, 500);
        }

        // Update word count
        function updateWordCount() {
            const text = textarea.value.trim();
            const count = text === '' ? 0 : text.split(/\s+/).length;
            wordCount.textContent = count;
        }

        // Event listeners
        textarea.addEventListener('input', () => {
            autoSave();
            updateWordCount();
        });

        // Initialize
        updateDate();
        loadNotes();
    </script>
</body>
</html>
